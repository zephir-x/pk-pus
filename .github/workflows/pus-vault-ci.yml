name: PUS-Vault CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "PusVault/**"
      - ".github/workflows/pus-vault-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "PusVault/**"
      - ".github/workflows/pus-vault-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run xUnit Tests (T-01..T-12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate ephemeral Custom CA & Server TLS certificates for tests
        working-directory: PusVault
        run: |
          chmod +x scripts/generate_certs.sh
          ./scripts/generate_certs.sh

      - name: Restore dependencies
        working-directory: PusVault
        run: dotnet restore PusVault.sln

      - name: Build solution (Release)
        working-directory: PusVault
        run: dotnet build PusVault.sln --configuration Release --no-restore

      - name: Run all automated xUnit tests
        working-directory: PusVault
        run: dotnet test PusVault.sln --configuration Release --no-build --logger "console;verbosity=detailed"

  publish-ghcr:
    name: Build & Push Docker Images to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata tags for Server image
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pus-vault-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Generate metadata tags for Client image
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pus-vault-client
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push PUS-Vault Server image
        uses: docker/build-push-action@v6
        with:
          context: ./PusVault
          file: ./PusVault/Dockerfile
          target: server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PUS-Vault Client image
        uses: docker/build-push-action@v6
        with:
          context: ./PusVault
          file: ./PusVault/Dockerfile
          target: client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max